# yaml-language-server: $schema=https://render.com/schema/render.yaml
services:
  - type: web
    name: erp-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually to your Neon PostgreSQL connection string
      - key: CORS_ORIGINS
        sync: false  # Set to your Vercel frontend URL (e.g. https://your-app.vercel.app)
      - key: PYTHON_VERSION
        value: "3.11.9"
